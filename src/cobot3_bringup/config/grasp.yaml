meta:
  generated_by: isaacpjt/tools/define_grasp.py
  source: isaacpjt/tools/out/layout_measured.yaml
  units: m, rad
qr_frame_convention:
  x: 라벨 이미지의 오른쪽
  y: 라벨 이미지의 아래
  z: x cross y = 라벨 안쪽 (= -바깥법선)
  note: ROS 광학 프레임과 같은 손 방향. solvePnP 결과를 그대로 쓸 수 있다.
suction_point: flange_plate 윗면 중심
approach_axis_world:
- 0.0
- 0.0
- -1.0
cup_diameter_m: 0.05
pre_grasp_m: 0.15
approach_slow_from_m: 0.03
grip_gaps_m:
- 0.005
- 0.002
- 0.0
- -0.003
grip_gaps_note: 첫 칸(+5 mm)은 주황에서 한 번도 안 붙는다. 그래서 헛도는 줄 알고 빼 봤더니 주황이 10/10 -> 2/10
  으로 무너졌다 (파랑은 9/10 유지). 즉 +5 는 흡착을 노리는 칸이 아니라 단계 역할을 한다 — 실패한 +5 시도가 접근고도(145 mm)에서
  곧장 내려오는 대신 3 mm 만 더 내려가게 만들고, 그 사이 물리가 안정된다. 빼지 마라.
lift_m: 0.1
flange_vision:
  why: QR 라벨은 옆벽에 서 있어 매거진 yaw 가 '화면 밖으로 기우는' 회전이 된다. 36 mm 코드를 273 mm 에서 보면 1도에 좌우
    변 길이 차가 0.2 px 인데 cv2 꼭짓점 잔차가 RMS 2.1 px 라 yaw 가 1σ 2.3도로 흔들린다 (diag_qr_reproj.py,
    eval_qr_pose.py). 위에서 보면 yaw 는 화면 안 회전이고 80 mm 변 전체에 직선을 맞추며, 컵을 놓을 바로 그 면을 잰다.
  observe_cam_height_m: 0.25
  observe_image_offset_px:
  - 0
  - -110
  settle_steps: 30
  render_steps: 4
  search_radius_m: 0.05
  use_depth: true
  depth_band_m: 0.012
  size_tol: 0.1
  min_fill: 0.9
  max_depth_correction_m: 0.015
magazines:
  magazine_orange:
    color: orange
    flange_size:
    - 0.08
    - 0.08
    - 0.006
    cup_margin_m: 0.015
    T_QR_grasp_xyz:
    - 0.09
    - -0.067
    - 0.0705
    approach_axis_in_qr:
    - 0.0
    - 1.0
    - 0.0
    qr_overlap: false
    labels_agree_mm: 0.0
  magazine_blue:
    color: blue
    flange_size:
    - 0.08
    - 0.08
    - 0.01
    cup_margin_m: 0.015
    T_QR_grasp_xyz:
    - 0.115
    - -0.071
    - 0.1005
    approach_axis_in_qr:
    - 0.0
    - 1.0
    - 0.0
    qr_overlap: false
    labels_agree_mm: 0.0
  # ── 트레이 스택 (static_test 시나리오의 스택 pick) ──────────────────────
  # ★ 미실측. 값은 에셋(isaacpjt/assets/F3_STKO_1.usda / F3_STKB_1.usda)의
  #   기하에서 매거진과 같은 규칙으로 계산했다 — T_QR_grasp_xyz 는 QR 중심에서
  #   플랜지 윗면 중심까지의 벡터를 QR 프레임(x=라벨 오른쪽, y=라벨 아래,
  #   z=라벨 안쪽)으로 옮긴 것. 매거진 값으로 역산해 규칙이 맞는 것은 확인했다
  #   (magazine_1_orange: QR (-0.090,-0.0705,0.075) → 플랜지 (0,0,0.142) →
  #   [0.09, -0.067, 0.0705] 그대로). 플랜지는 넷 다 80x80 이고 색도 같아
  #   flange_vision 은 그대로 쓴다. QR 은 40 mm 라 매거진(50 mm)보다 작다.
  #   Isaac 에서 실제로 집히는지는 아직 확인하지 않았다.
  tray_orange:
    color: orange
    flange_size:
    - 0.08
    - 0.08
    - 0.006
    cup_margin_m: 0.015
    # QR 중심 (-0.1373, -0.06845, 0.02472), 플랜지 윗면 z 0.07772
    T_QR_grasp_xyz:
    - 0.1373
    - -0.053
    - 0.06845
    approach_axis_in_qr:
    - 0.0
    - 1.0
    - 0.0
    qr_overlap: false
    labels_agree_mm: 0.0
  tray_blue:
    color: blue
    flange_size:
    - 0.08
    - 0.08
    - 0.01
    cup_margin_m: 0.015
    # QR 중심 (-0.1373, -0.06845, 0.03996), 플랜지 윗면 z 0.09696
    T_QR_grasp_xyz:
    - 0.1373
    - -0.057
    - 0.06845
    approach_axis_in_qr:
    - 0.0
    - 1.0
    - 0.0
    qr_overlap: false
    labels_agree_mm: 0.0
