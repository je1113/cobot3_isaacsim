meta:
  generated_by: isaacpjt/tools/define_grasp.py
  source: isaacpjt/tools/out/layout_measured.yaml
  units: m, rad
qr_frame_convention:
  x: 라벨 이미지의 오른쪽
  y: 라벨 이미지의 아래
  z: x cross y = 라벨 안쪽 (= -바깥법선)
  note: ROS 광학 프레임과 같은 손 방향. solvePnP 결과를 그대로 쓸 수 있다.
suction_point: flange_plate 윗면 중심
approach_axis_world:
- 0.0
- 0.0
- -1.0
cup_diameter_m: 0.05
pre_grasp_m: 0.15
approach_slow_from_m: 0.03
grip_gaps_m:
- 0.005
- 0.002
- 0.0
- -0.003
grip_gaps_note: 첫 칸(+5 mm)은 주황에서 한 번도 안 붙는다. 그래서 헛도는 줄 알고 빼 봤더니 주황이 10/10 -> 2/10
  으로 무너졌다 (파랑은 9/10 유지). 즉 +5 는 흡착을 노리는 칸이 아니라 단계 역할을 한다 — 실패한 +5 시도가 접근고도(145 mm)에서
  곧장 내려오는 대신 3 mm 만 더 내려가게 만들고, 그 사이 물리가 안정된다. 빼지 마라.
lift_m: 0.1
flange_vision:
  why: QR 라벨은 옆벽에 서 있어 매거진 yaw 가 '화면 밖으로 기우는' 회전이 된다. 36 mm 코드를 273 mm 에서 보면 1도에 좌우
    변 길이 차가 0.2 px 인데 cv2 꼭짓점 잔차가 RMS 2.1 px 라 yaw 가 1σ 2.3도로 흔들린다 (diag_qr_reproj.py,
    eval_qr_pose.py). 위에서 보면 yaw 는 화면 안 회전이고 80 mm 변 전체에 직선을 맞추며, 컵을 놓을 바로 그 면을 잰다.
  observe_cam_height_m: 0.25
  observe_image_offset_px:
  - 0
  - -110
  settle_steps: 30
  render_steps: 4
  search_radius_m: 0.05
  use_depth: true
  depth_band_m: 0.012
  size_tol: 0.1
  min_fill: 0.9
  max_depth_correction_m: 0.015
verified:
  tool: PICK_TRIALS=10 PICK_HEADLESS=1 [PICK_TARGET=...] isaac_python isaacpjt/M0609/lula_ik/12_pick_test.py
  magazine_1_orange:
    result: 10 / 10 성공
    cycle_time_s:
      mean: 2.04
      min: 1.99
      max: 2.06
    lift_rise_mm_min: 88.6
    tilt_deg_max: 0.1
  magazine_2_blue:
    result: 10 / 10 성공  (플랜지를 80x80 으로 고친 뒤)
    cycle_time_s:
      mean: 2.04
      min: 2.01
      max: 2.06
    lift_rise_mm_min: 88.4
    tilt_deg_max: 0.1
    base_x: -5.9233
  flange_vision:
    tool: PICK_VISION=1 PICK_TRIALS=10 PICK_HEADLESS=1 [PICK_DEPTH_NOISE_MM=2] isaac_python
      isaacpjt/M0609/lula_ik/12_pick_test.py
    setup: 매거진 ±10 mm / ±5도 교란, prior(QR 대역) 오차 ≤5 mm / ±7도, 관측 높이 250 mm
    measurement_2026_09_17:
      orange:
        detected: 10/10
        xy_mm_max: 0.28
        z_mm_max: 0.0
        yaw_deg_max: 0.018
      orange_noise2mm:
        detected: 10/10
        xy_mm_max: 0.29
        z_mm_max: 0.02
        yaw_deg_max: 0.011
      blue:
        detected: 10/10
        xy_mm_max: 0.27
        z_mm_max: 0.0
        yaw_deg_max: 0.032
      blue_noise2mm:
        detected: 10/10
        xy_mm_max: 0.27
        z_mm_max: 0.02
        yaw_deg_max: 0.029
    pick_result: 주황 9/10, 파랑 10/10. 주황 실패 1 건(trial 8)은 인식 오차 0.26 mm 였고 PICK_MAG_DELTA=6.65,5.74,-2.61
      로 GT 파지를 해도 3/3 실패한다 — 인식 문제가 아니다. frames.yaml open_issues pick-magazine-pushed-on-descent
      참고.
    caveat: 시뮬 깊이는 가장자리가 칼같고, 가우시안 노이즈는 실물의 flying pixel / 가장자리 번짐을 흉내 내지 못한다. xy
      0.3 mm 는 실물에서 그대로 기대할 수 없다.
  criteria: rise >= 5 mm, tilt <= 5 deg
  note: GT 플랜지 pose 로 파지한다. QR 인식 오차는 아직 안 들어가 있다.
  harness_fix: 반복 실행이 되게 하려고 12_pick_test.py 를 두 군데 고쳤다. (1) 매거진 리셋이 USD xform 쓰기라
    시뮬 중에는 먹지 않았다 — SingleRigidPrim 으로 옮기고 속도까지 턴다. (2) 리셋을 베이스 텔레포트/팔 스냅보다 먼저 하고
    있어서 그 뒤에 다시 흔들렸다. y 진폭이 7->11->21->30->60->100 mm 로 커져 IK 가 안 풀리는 트라이얼이 나왔다. 로봇을
    다 세운 뒤 맨 마지막에 매거진을 놓도록 순서를 바꿨고, 지금은 10 회가 전부 같은 자리에서 시작한다.
