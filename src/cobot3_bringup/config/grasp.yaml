meta:
  generated_by: isaacpjt/tools/define_grasp.py
  source: isaacpjt/tools/out/layout_measured.yaml
  units: m, rad
qr_frame_convention:
  x: 라벨 이미지의 오른쪽
  y: 라벨 이미지의 아래
  z: x cross y = 라벨 안쪽 (= -바깥법선)
  note: ROS 광학 프레임과 같은 손 방향. solvePnP 결과를 그대로 쓸 수 있다.
suction_point: flange_plate 윗면 중심
approach_axis_world:
- 0.0
- 0.0
- -1.0
cup_diameter_m: 0.05
pre_grasp_m: 0.15
approach_slow_from_m: 0.03
grip_gaps_m:
- 0.005
- 0.002
- 0.0
- -0.003
grip_gaps_note: 첫 칸(+5 mm)은 주황에서 한 번도 안 붙는다. 그래서 헛도는 줄 알고 빼 봤더니 주황이 10/10 -> 2/10
  으로 무너졌다 (파랑은 9/10 유지). 즉 +5 는 흡착을 노리는 칸이 아니라 단계 역할을 한다 — 실패한 +5 시도가 접근고도(145 mm)에서
  곧장 내려오는 대신 3 mm 만 더 내려가게 만들고, 그 사이 물리가 안정된다. 빼지 마라.
lift_m: 0.1
flange_vision:
  why: QR 라벨은 옆벽에 서 있어 매거진 yaw 가 '화면 밖으로 기우는' 회전이 된다. 36 mm 코드를 273 mm 에서 보면 1도에 좌우
    변 길이 차가 0.2 px 인데 cv2 꼭짓점 잔차가 RMS 2.1 px 라 yaw 가 1σ 2.3도로 흔들린다 (diag_qr_reproj.py,
    eval_qr_pose.py). 위에서 보면 yaw 는 화면 안 회전이고 80 mm 변 전체에 직선을 맞추며, 컵을 놓을 바로 그 면을 잰다.
  observe_cam_height_m: 0.25
  observe_image_offset_px:
  - 0
  - -110
  settle_steps: 30
  render_steps: 4
  search_radius_m: 0.05
  use_depth: true
  depth_band_m: 0.012
  size_tol: 0.1
  min_fill: 0.9
  max_depth_correction_m: 0.015
magazines:
  magazine_orange:
    color: orange
    flange_size:
    - 0.08
    - 0.08
    - 0.006
    cup_margin_m: 0.015
    T_QR_grasp_xyz:
    - 0.09
    - -0.067
    - 0.0705
    approach_axis_in_qr:
    - 0.0
    - 1.0
    - 0.0
    qr_overlap: false
    labels_agree_mm: 0.0
  magazine_blue:
    color: blue
    flange_size:
    - 0.08
    - 0.08
    - 0.01
    cup_margin_m: 0.015
    T_QR_grasp_xyz:
    - 0.115
    - -0.071
    - 0.1005
    approach_axis_in_qr:
    - 0.0
    - 1.0
    - 0.0
    qr_overlap: false
    labels_agree_mm: 0.0
  # ── 트레이 스택 (static_test 시나리오의 스택 pick) ──────────────────────
  # ★ 2026-09-25 실측 교정 — isaacpjt/M0609/lula_ik/15_stack_scan_pick_test.py
  #   의 calibrate_grasp_offset()(PICK_CALIBRATE=1)로 Isaac 안에서 처음 실측
  #   검증했다. tray_blue 로 재봤더니 GT 플랜지 위치와 163.6mm 어긋났고, QR
  #   프레임으로 본 오차 벡터가 그때의 T_QR_grasp_xyz 값과 거의 그대로
  #   (성분별 비율 1.97~2.01배) 겹쳤다 — 아래 "★ 미실측"이 쓰던 값이 정확히
  #   절반이었다는 뜻이다.
  #
  #   원인(당시): 아래 값은 F3_STKO_1.usda/F3_STKB_1.usda 의 "로컬"(에셋
  #   자체) 좌표로 계산됐는데, 그때 씬에 스택이 놓일 때는 xformOp:scale=2 가
  #   걸렸다(packaging_flow.py/15_stack_scan_pick_test.py 의 SpawnedStacks).
  #   QR→플랜지 벡터도 스케일을 그대로 받으므로 월드에서는 로컬 값의 2배가
  #   맞았다. 매거진 쪽 값(위 orange/blue)은 스케일이 없어 이 문제가 없다.
  #
  #   ★ flange_size 도 같은 이유로 당시 2배였다 — 실측 크기가 160mm(80mm 의
  #   2배)로 나와서 확인했다(run_trial_real_pipeline, PICK_REAL_PIPELINE=1).
  #
  #   ★★ 2026-09-26 — 스택을 절반 크기로 되돌렸다(xformOp:scale 2.0 -> 1.0,
  #   packaging_flow.py/15_stack_scan_pick_test.py 둘 다, 질량도 부피비만큼
  #   낮춤 — SCAN 접근 크립 여유거리·PICK 흡착+LIFT 전부 실측 확인). 그래서
  #   위 "x2" 보정을 다시 걷어낸다 — 아래 값은 로컬(에셋 그대로) 값이다.
  #   tray_blue 의 실측 보정값([0.2757, -0.1138, 0.1347], scale=2 기준)을
  #   그대로 반으로 나누면 [0.13785, -0.0569, 0.06735] — 아래 로컬 계산값과
  #   1mm 안쪽으로 일치해 이 되돌림이 맞다는 걸 다시 확인했다.
  tray_orange:
    color: orange
    # 로컬 [0.08, 0.08, 0.006] — xformOp:scale=1.0(2026-09-26, 위 참고)
    flange_size:
    - 0.08
    - 0.08
    - 0.006
    cup_margin_m: 0.015
    # QR 중심(로컬) (-0.1373, -0.06845, 0.02472), 플랜지 윗면 z(로컬) 0.07772
    # -> [0.1373, -0.053, 0.06845] — xformOp:scale=1.0(2026-09-26, 위 참고)
    T_QR_grasp_xyz:
    - 0.1373
    - -0.053
    - 0.06845
    approach_axis_in_qr:
    - 0.0
    - 1.0
    - 0.0
    qr_overlap: false
    labels_agree_mm: 0.0
  tray_blue:
    color: blue
    # 로컬 [0.08, 0.08, 0.01] — xformOp:scale=1.0(2026-09-26, 위 참고)
    flange_size:
    - 0.08
    - 0.08
    - 0.01
    cup_margin_m: 0.015
    # QR 중심(로컬) (-0.1373, -0.06845, 0.03996), 플랜지 윗면 z(로컬) 0.09696
    # -> [0.1373, -0.057, 0.06845] — xformOp:scale=1.0(2026-09-26, 위 참고).
    # 실측(scale=2 기준) [0.2757, -0.1138, 0.1347] 을 반으로 나누면
    # [0.13785, -0.0569, 0.06735] — 이 값과 1mm 안쪽으로 일치한다.
    T_QR_grasp_xyz:
    - 0.1373
    - -0.057
    - 0.06845
    approach_axis_in_qr:
    - 0.0
    - 1.0
    - 0.0
    qr_overlap: false
    labels_agree_mm: 0.0
