# ══════════════════════════════════════════════════════════════════════
#  스테이션 — 웹 관제 UI 「설정 > 스테이션」 탭이 읽고 쓴다.
#
#  왜 DB 가 아니라 파일인가: docs/DB구성.md §10-1 · §8-5.
#    place 자세는 pick_place_server 가 '매 동작마다' 읽는다. DB 로 옮기면
#    "DB 가 죽으면 로봇이 못 움직인다" 에 정확히 걸린다.
#
#  ★ 구조는 화면(StationSettingsPage)의 상태 모양 그대로다. 순서가 화면
#    순서라서 리스트다. 숫자는 여기서는 숫자, 화면으로 나갈 때 문자열
#    (shapes.py 가 번역한다). 미입력은 null.
#
#  ★ task_manager.py 의 TEST_LOADER 상수가 하던 일을 이 파일로 옮긴다.
#    그 상수를 지울 때 place_pose 와 값이 같은지 볼 것 —
#    isaacpjt/tools/check_staging_poses.py 가 둘이 같은지 검사한다.
#
#  ★ station_type      : '' | PACKAGING | TEST | STORAGE
#    completion_signal : '' | TIMER | VISION | 'TIMER + VISION' | EXTERNAL
#    (공백 포함까지 화면 코드의 문자열과 정확히 같아야 한다)
# ══════════════════════════════════════════════════════════════════════
meta:
  units: m, rad, s
  joints: 6

stations:
  - station_id: PKG-01
    station_type: PACKAGING
    # 로봇이 place 하려고 서는 자리 (map 프레임).
    # ★ 2026-09-22: y 를 0.0 에서 4.60 으로 옮겼다. 씬의 PackagingZone 프림에
    #   translate (0, 4.6, 0) 이 걸려 있어 포장 투입 벨트가 월드 y 4.05~5.15 에
    #   있는데, 이 좌표는 그 이동 전 값이라 로봇이 허공에 매거진을 놓고 있었다.
    #   x 3.75 는 그 자리의 제자리회전 여유(25도)를 보고 고른 값이다.
    # ★ 2026-09-22: x 3.75 -> 3.70. task_manager 의 TEST_LOADER 와 같은 점이어야
    #   한다(그쪽 주석에 근거). 3.75 는 Nav2 내접 반경(0.28) 대비 마진이 2 cm 뿐인데
    #   코스트맵 해상도가 0.05 m 라 한 셀 안이다.
    # ★ 2026-09-23 실측 — simple_factory_layout.usda 의 /World/Environment/
    #   PackagingZone (프림 translate (0, 4.6, 0), 월드 바운딩박스로 쟀다):
    #       BeltTop   x 4.050 ~ 8.750   y 4.050 ~ 5.150   윗면 z 0.541
    #       → 벨트 중심선 y = 4.600, 벨트 서쪽 끝 x = 4.050
    #   로봇은 벨트 서쪽 끝 앞에서 +x(벨트 쪽)를 보고 선다.
    #   x 는 Nav2 여유로 정한다. 점유맵(cobot3_navigation/maps) 에서 y=4.600
    #   줄의 가장 가까운 장애물까지 거리가
    #       x 3.60 -> 0.45   3.65 -> 0.40   3.70 -> 0.35 ✅   3.75 -> 0.30   3.80 -> 0.25 ★
    #   내접 반경 0.28 에 한 셀(0.05) 이상 남는 3.70 을 쓴다. 배치점은 base_link
    #   앞 0.50 m(place.yaml)라 4.20 — 벨트 위다.
    #   task_manager.TEST_LOADER (3.70, 4.60, 0.0) 와 같은 값이어야 한다.
    # ★ 2026-09-23: 3.70 -> 3.42 — task_manager TEST_LOADER 와 같다. Nav2 는 여기
    #   까지, 그 뒤 0.50 m 는 직진(LOADER_CREEP_M)으로 3.92 에 서서 놓는다.
    place_pose: {x: 3.42, y: 4.60, theta: 0.0}
    place_arm_pose: [null, null, null, null, null, null]
    # ⚠️ 실측 필요. 이 값이 그대로 "회수 가능 시각 = place 완료 + process_time"
    #    이 된다. 너무 짧으면 회수하러 가서 헛탕 치고 재시도만 쌓인다.
    process_time: 60
    output_type: stack
    completion_signal: TIMER
    capacity: 1
    updated_at: null

  - station_id: TEST-01
    station_type: TEST
    # ★ 2026-09-23 실측 — simple_factory_layout.usda 의 /World/Environment/
    #   TestingZone (월드 바운딩박스로 쟀다):
    #       BeltTop   x 4.050 ~ 8.750   y -3.255 ~ -2.155   윗면 z 0.541
    #       → 벨트 중심선 y = -2.705, 벨트 서쪽 끝 x = 4.050
    #   PackagingZone 과 벨트 x 범위 · 폭 · 높이가 똑같다. 점유맵 여유도 같다:
    #       x 3.60 -> 0.45   3.65 -> 0.40   3.70 -> 0.35 ✅   3.75 -> 0.30   3.80 -> 0.25 ★
    #   그래서 PKG-01 과 같은 규칙으로 x 3.70, +x(벨트 쪽)를 본다.
    #   로봇 차체(뒤 0.607 · 앞 0.14 · 반폭 0.28) + 0.5 m 안에 이 벨트 말고
    #   다른 구조물은 없다.
    #   ☞ PackagingZone 과 달리 투입 트리거(PackagingInputTrigger)가 씬에 없다.
    #     여기 놓은 매거진은 벨트가 받아 가지 않을 수 있다.
    # ★ 2026-09-23: 3.70 -> 3.42 — task_manager TEST_STATION 과 같다(PKG-01 주석).
    place_pose: {x: 3.42, y: -2.705, theta: 0.0}
    place_arm_pose: [null, null, null, null, null, null]
    process_time: null
    output_type: ''
    completion_signal: ''
    capacity: null
    updated_at: null
