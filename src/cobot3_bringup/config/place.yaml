# ══════════════════════════════════════════════════════════════════════
#  PlaceCarrier.action ★ 블록의 place_yaml. variant → base_link 기준
#  배치 자세(슬롯 바닥) 표. pick_place_server 가 goal.variant 로 찾는다.
#
#  ★ 알려진 갭: 로더 슬롯 지오메트리가 아직 씬에 없다(PlaceCarrier.action
#  주석 참고). 두 매거진 variant 모두 지금은 isaacpjt/M0609/lula_ik/
#  12_place_test.py 가 검증한 지점 하나(PLACE_TARGET_XY/CONVEYOR_BELT_Z,
#  task_manager.py TEST_LOADER=(3.85, 0.0, 0.0) 도착 시점 기준)를 그대로
#  쓴다. 로더 실물이 정해지면 variant 별로 갈라야 한다("스택 → 테스트
#  로더"는 아직 씬에 tray QR 이 없어 해당 없음 — carriers.yaml 참고).
#
#  ★ 바닥(z=0) 스테이징에서 컨베이어 벨트 위(z=0.6, GUI로 직접 측정)로
#  바꿨다 — 바닥은 팔 마운트 높이(~0.63m)에서 도달 한계 근처까지 뻗어야
#  해서 MOVE 도중 흡착을 놓치는 문제가 있었는데, 벨트 높이는 마운트
#  높이와 비슷해 훨씬 자연스러운 자세가 된다(12_place_test.py 실측 확인).
#  position 은 TEST_LOADER=(3.85,0,yaw0) 에 선 base_link 기준
#  PLACE_TARGET_XY=(4.1,0.0), z=CONVEYOR_BELT_Z(0.6) 오프셋이다:
#    dx = 4.1 - 3.85 = 0.25
#    dz = 0.6 - CARTER_Z(0.07963398335074101) = 0.520366016649259
# ══════════════════════════════════════════════════════════════════════
meta:
  units: m
  source: isaacpjt/M0609/lula_ik/12_place_test.py PLACE_TARGET_XY/CONVEYOR_BELT_Z (WP_PLACE=TEST_LOADER 기준 오프셋)

magazines:
  magazine_1_orange:
    position: [0.25, 0.0, 0.520366016649259]
    quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  magazine_2_blue:
    position: [0.25, 0.0, 0.520366016649259]
    quat_wxyz: [1.0, 0.0, 0.0, 0.0]
