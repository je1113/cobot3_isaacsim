# ══════════════════════════════════════════════════════════════════════
#  선반 정의 — 웹 관제 UI 「설정 > 선반」 탭이 읽고 쓴다.
#
#  왜 DB 가 아니라 파일인가: docs/DB구성.md §10-1.
#    "주인이 하나(엔지니어), 미션 시작 때 한 번 읽는다."
#  화면에서 편집한다는 사실 자체는 DB 사유가 아니다 — 편집기는 파일도 쓴다.
#
#  ★ 구조는 화면(ShelfSettingsPage)의 상태 모양을 그대로 따른다. 순서도 화면
#    순서라서 map 이 아니라 **리스트**다.
#
#  ★ 여기 숫자는 숫자로 적는다. 화면은 <input type="number"> 라 값을 문자열로
#    들고 있지만, 이 파일은 로봇도 읽는다 — task_manager 가 "-4.85" 를 좌표로
#    쓸 수는 없다. 문자열↔숫자 변환은 web/backend/app/shapes.py 한 곳에서 한다.
#    미입력은 null 이고, 화면에는 '' 로 나간다.
#
#  ★ 티칭 완료 판정: scan_passes 가 하나 이상 있고, 모든 층의 arm_teach_pose
#    6칸이 전부 채워져 있을 것. 하나라도 비면 작업 배정이 422 로 거절된다.
#    (판정 규칙의 원본은 shapes.shelf_is_taught — 화면과 같은 규칙이어야 한다)
#
#  ★ 층은 하나로 고정해서 운용한다. 새 레이아웃의 매거진도 top_magazines 한
#    단뿐이라 씬과도 맞는다. 화면의 '층 추가' 버튼과 백엔드의 N층 지원은
#    그대로다 — 운용을 정한 것이지 구조를 막은 것은 아니다.
#
#  ★ 관절값(arm_teach_pose)은 전부 null = 미티칭이다. 숫자를 채워 두지 않는다 —
#    채워 두면 화면이 "티칭 완료 · 작업 할당 가능" 이라 말하고, 아무도 티칭한
#    적 없는 자세로 로봇이 팔을 뻗는다.
# ══════════════════════════════════════════════════════════════════════
#
#  ┌─ 좌표 출처 ────────────────────────────────────────────────────────
#  │ isaacpjt/worlds/simple_factory_layout.usda 를 직접 읽어 계산했다
#  │ (레이아웃 개편 feature/map_version2 + 70ced05 반영분).
#  │
#  │ 씬에서 읽은 값:
#  │   Shelf_01 중심 y=+2.9531, 전면기둥 y=+2.4891, 매거진 y=+2.5864
#  │   Shelf_02 중심 y=-1.9729, 전면기둥 y=-2.4369, 매거진 y=-1.6136
#  │   매거진 x = -2.4408 / -1.8642 / -1.2396 / -0.6408  (양쪽 선반 동일)
#  │   매거진 z = 0.6  (top_magazines 한 단)
#  │
#  │ 서 있는 자리는 **티칭 자세가 실제로 쓴 상대 위치**를 그대로 옮겼다:
#  │   taught_poses.yaml 의 shelf_1_top_close_centered
#  │     base_link_world y = 1.45,  그 시점 매거진 y = 2.00  →  앞 0.55 m
#  │ 그 자세의 카메라→QR 거리가 278 mm 인데, grasp.yaml flange_vision 주석의
#  │ "36 mm 코드를 273 mm 에서 보면" 과 일치한다 — 교차검증됐다.
#  │
#  │ ⚠️ 한때 0.45 로 적었다가 고쳤다. 0.45 는 옛 USD 의 **스폰 위치**(y=1.55)
#  │    에서 나온 값인데, 그건 순찰 없이 SCAN 부터 테스트하려고 옮겨 둔 자리지
#  │    파지가 검증된 자리가 아니다. 검증된 것은 12_place_test.py 의
#  │    WP_PICK(y=1.45) 과 위 티칭 자세다.
#  │
#  │ ⚠️ 두 선반은 통로(폭 4.0 m)를 사이에 두고 마주본다. 그런데 Shelf_02 는
#  │    회전하지 않은 복사본이라 **기둥 이름상 '뒤'(Post_B*)가 통로를 향한다.**
#  │    매거진은 통로 쪽에 놓여 있어 동작에는 문제가 없지만, 씬의 이름과
#  │    실제 방향이 어긋나 있으니 레이아웃을 손볼 때 확인할 것.
#  │
#  │ ⚠️ 이 값들은 **씬에서 계산한 기하값이지 도달성 검증을 거친 값이 아니다.**
#  │    티칭(arm_teach_pose)을 하면서 실제로 닿는지 확인하고, 안 닿으면
#  │    여기 waypoint 를 먼저 고쳐야 한다.
#  └────────────────────────────────────────────────────────────────────
meta:
  units: m, rad
  joints: 6            # arm_teach_pose 는 항상 J1..J6 여섯 칸
  source: isaacpjt/worlds/simple_factory_layout.usda

shelves:
  # 통로 북쪽. 선반이 로봇의 **왼쪽**에 오도록 +x 방향으로 진행한다(yaw 0).
  - shelf_id: SHELF-A
    # 양 끝 매거진 정면. 한 자리에서 네 개를 다 잡을 수는 없다 —
    # 매거진 스팬이 1.8 m 라 중앙에 서면 양 끝이 팔 도달거리(0.9 m) 밖이다.
    waypoint_start: {x: -2.4408, y: 2.0364, theta: 0.0}
    waypoint_end: {x: -0.6408, y: 2.0364, theta: 0.0}
    standoff_distance: 0.45      # 전면 기둥면 기준 (매거진 기준으로는 0.55)
    scan_passes:
      - pass_id: 1
        level: 1
        direction: FORWARD
        arm_teach_pose: [null, null, null, null, null, null]
    # 티칭이 처음 완성된 순간에만 찍힌다. 이후 수정해도 안 바뀐다.
    first_taught_at: null

  # 통로 남쪽. 선반이 왼쪽에 오려면 반대로 서야 해서 yaw = π 이고,
  # 그래서 진행 방향도 -x 다(start 와 end 의 x 가 A 와 뒤집혀 있다).
  - shelf_id: SHELF-B
    waypoint_start: {x: -0.6408, y: -1.0636, theta: 3.14159265}
    waypoint_end: {x: -2.4408, y: -1.0636, theta: 3.14159265}
    # 통로를 향한 쪽이 Shelf_02 의 '뒤' 기둥(y=-1.5118)이라 그 면 기준이다.
    standoff_distance: 0.45
    scan_passes:
      - pass_id: 1
        level: 1
        direction: FORWARD
        arm_teach_pose: [null, null, null, null, null, null]
    first_taught_at: null
