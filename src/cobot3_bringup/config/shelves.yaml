# ══════════════════════════════════════════════════════════════════════
#  선반 정의 — 웹 관제 UI 「설정 > 선반」 탭이 읽고 쓴다.
#
#  왜 DB 가 아니라 파일인가: docs/DB구성.md §10-1.
#    "주인이 하나(엔지니어), 미션 시작 때 한 번 읽는다."
#  화면에서 편집한다는 사실 자체는 DB 사유가 아니다 — 편집기는 파일도 쓴다.
#
#  ★ 구조는 화면(ShelfSettingsPage)의 상태 모양을 그대로 따른다. 순서도 화면
#    순서라서 map 이 아니라 **리스트**다.
#
#  ★ 여기 숫자는 숫자로 적는다. 화면은 <input type="number"> 라 값을 문자열로
#    들고 있지만, 이 파일은 로봇도 읽는다 — task_manager 가 "-4.85" 를 좌표로
#    쓸 수는 없다. 문자열↔숫자 변환은 web/backend/app/shapes.py 한 곳에서 한다.
#    미입력은 null 이고, 화면에는 '' 로 나간다.
#
#  ★ 티칭 완료 판정: scan_passes 가 하나 이상 있고, 모든 층의 arm_teach_pose
#    6칸이 전부 채워져 있을 것. 하나라도 비면 작업 배정이 422 로 거절된다.
#    (판정 규칙의 원본은 shapes.shelf_is_taught — 화면과 같은 규칙이어야 한다)
# ══════════════════════════════════════════════════════════════════════
meta:
  units: m, rad
  joints: 6            # arm_teach_pose 는 항상 J1..J6 여섯 칸

shelves:
  - shelf_id: SHELF-A
    # 씬의 Shelf_01 (북쪽). 매거진은 shelf_1_magaines 다.
    assigned_robot: robot1

    # 선반을 훑기 시작하는 자리와 끝내는 자리 (map 프레임, theta 는 rad).
    # task_manager 가 이 두 점을 순찰 왕복 구간으로 쓴다(_shelf_route).
    #
    # ★ y 는 0.55 m 정차선이다. 12_place_test2.py 의 SHELF_STANDOFF_M 과 같고,
    #   taught_poses 의 shelf_1_top_close_centered 가 실제로 쓴 상대 위치다
    #   (그 파일: py = 매거진_y - 0.55 * cos(theta)). 매거진이 y≈+2.586 이라
    #   정차선이 +2.0364 가 된다. 이 값은 SHELF_EXIT_ROBOT1 과도 같다.
    #
    # ★ 두 점의 theta 가 같아야 한다. 그래야 끝점에서 제자리 회전 없이
    #   전진/후진으로 왕복한다(task_manager DEFAULT_PATROL_ROUTE 주석).
    #   선반 앞 여유는 0.45 m 뿐이라 여기서 도는 것은 위험하다 — 직진 통과는
    #   0.40 m 면 되지만 제자리 회전은 0.70 m 가 필요하다(외접 반경 0.656 m).
    #
    # ★ 시작점을 통로 동쪽(x=+0.60)에 둔 이유: START 단계는 Nav2 로 가고,
    #   Nav2 는 목표에서 최종 yaw 를 맞추려고 제자리 회전을 한다. 그 자리
    #   여유가 1.01 m 라 안전하다. 선반 앞(여유 0.45 m)을 시작점으로 두면
    #   거기서 돌다가 넘어진다 — robot2 가 실제로 그렇게 넘어졌다
    #   (12_place_test2.py "robot2 가 SHELF-B 앞에서 넘어졌다").
    #
    # 점유맵(simple_factory_layout.png) 실측: 구간 최소여유 0.45 m.
    # ★ y = 2.1864 — 원래 SHELF_STANDOFF_M(0.55) 정차선이 2.0364 였고
    #   거기서 두 번 +0.05, +0.10 붙였다(2026-09-22). PICK 이 NO_FLANGE 로
    #   죽는 것이 팔이 못 닿아서라고 보고 매거진 쪽으로 당긴 값이다.
    #   매거진(y≈2.5864)과 명목 0.40 m.
    #
    # ★★ 여유가 기준 밑이다. 이 선의 구간 최소여유는 0.30 m 이고
    #   12_place_test2.py 가 정한 직진 통과 기준은 0.40 m(차체 반폭 0.25 +
    #   패딩)다. 즉 순찰 중에 선반을 긁을 수 있다. 사람이 시뮬을 보면서
    #   그 위험을 받아들이고 정한 값이다 — 자동으로 되돌리지 말 것.
    #   근본 해법은 순찰선을 당기는 것이 아니라 PICK 때만 매거진 쪽으로
    #   접근했다 물러나는 단계를 넣는 것이다(12_place_test2.py 의 go_to_pick).
    #
    # ★ 끝점을 -2.70 -> -1.20 으로 줄였다. 이유는 여유가 아니라 정확도다.
    #   로봇은 START(Nav2, xy_goal_tolerance 0.25)로 시작점에 서면서 순찰선을
    #   최대 0.25 m 벗어나고, 끝점을 향해 직선으로 가며 서서히 선에 수렴한다.
    #   매거진이 구간의 뒤쪽에 있을수록 그 오차가 더 상쇄된다:
    #       끝점 -2.70  매거진이 38% 지점  -> 오차의 62% 가 남음
    #       끝점 -1.20  매거진이 69% 지점  -> 오차의 31% 만 남음
    #   편도도 3.30 m -> 1.80 m 로 줄어 사이클이 절반이 된다.
    #   ☞ 대가: 선반 서쪽 절반(x < -1.20)은 안 훑는다. 시험 씬의 매거진은
    #     x≈-0.641 하나뿐이라 지금은 문제없지만, 매거진을 서쪽에 놓으면
    #     끝점을 다시 늘려야 한다.
    waypoint_start: {x: 0.60, y: 2.1864, theta: 0.0}
    waypoint_end: {x: -1.20, y: 2.1864, theta: 0.0}

    # 선반 면에서 떨어져 서는 거리 = 12_place_test2.py SHELF_STANDOFF_M.
    # carrier_code_reader 는 이 값을 QR 폴링 구역(위 두 점을 잇는 직선을
    # 상하좌우로 키운 사각형)의 여유로도 쓴다 — 도착 오차를 삼키는 몫이다.
    standoff_distance: 0.55
    # ★ 층은 하나로 고정해서 운용한다. 화면에는 '층 추가' 버튼이 남아 있고
    #   백엔드도 N개를 받는다 — 운용을 한 층으로 정한 것이지 구조를 막은 것은 아니다.
    # ★ 관절값은 전부 null(미티칭)이다. 실측 전까지 숫자를 채워 두지 않는다 —
    #   채워 두면 화면이 "티칭 완료 · 작업 할당 가능" 이라 말하고 로봇이 그
    #   가짜 자세로 팔을 뻗는다.
    scan_passes:
      - pass_id: 1
        level: 1
        direction: FORWARD
        arm_teach_pose: [null, null, null, null, null, null]
    # 티칭이 처음 완성된 순간에만 찍힌다. 이후 수정해도 안 바뀐다.
    first_taught_at:
  - shelf_id: SHELF-B
    # 씬의 Shelf_02 (남쪽). 매거진은 shelf_2_magaines 다.
    assigned_robot: robot2

    # SHELF-A 를 남쪽 선반에 거울로 뒤집은 값이다. 통로가 선반의 +y 쪽이라
    # theta 가 pi 이고(로봇이 북쪽을 등진다), 정차선은 매거진 y≈-1.614 에서
    # +0.55 한 -1.0636 이다. SHELF_EXIT_ROBOT2 와 같은 y 다.
    #
    # ★ 여기가 넘어진 자리다. 구간 최소여유가 0.40 m 로 SHELF-A(0.45)보다
    #   좁다. 직진 통과 기준(0.40)은 겨우 넘지만 회전 기준(0.70)에는 한참
    #   못 미친다. 그래서 두 점의 theta 를 같게 두는 것이 SHELF-A 보다 더
    #   중요하다 — 순찰은 회전하지 않지만, nav_server 의 조향이 30도를 넘기면
    #   제자리 회전으로 전환된다(TURN_IN_PLACE_ANGLE). amcl yaw 가 그만큼
    #   틀어지면 여기서 위험하다.
    # ★ y = -1.0136 — 원래 SHELF_STANDOFF_M(0.55) 정차선이 -1.0636 이었다.
    #   팔이 선반 옆 책상에 박아서 통로 쪽으로 0.10 물렸다가(-0.9636),
    #   PICK 이 NO_FLANGE 로 죽어서 다시 0.05 당긴 값이다(2026-09-22).
    #   매거진(y≈-1.6136)과 명목 0.60 m — 티칭보다 아직 5 cm 멀다.
    #   여기가 "팔이 닿는 거리" 와 "팔이 안 박는 거리" 의 절충점이다.
    #
    # ★ 구간 최소여유 0.45 m 로 기준(0.40)은 넘는다. robot1 쪽(0.30)과 달리
    #   이쪽은 통로가 넓어서 여유가 있다.
    #
    # ★ 끝점 -1.20 은 SHELF-A 와 같은 이유다(그쪽 주석 참고) — 매거진이
    #   구간 뒤쪽(62%)에 와서 START 도착 오차가 더 상쇄된다.
    waypoint_start: {x: 0.60, y: -1.0136, theta: 3.141593}
    waypoint_end: {x: -1.20, y: -1.0136, theta: 3.141593}

    standoff_distance: 0.55

    # ★ 관절값은 SHELF-A 와 같이 전부 null(미티칭)이다. 채워 두면 화면이
    #   "티칭 완료 · 작업 할당 가능" 이라 말하고 로봇이 가짜 자세로 팔을
    #   뻗는다. 순찰 중 QR 폴링은 이게 비어 있어도 된다 —
    #   carrier_code_reader 가 taught_poses.yaml 의 이름으로 폴백한다
    #   (FALLBACK_POSE_BY_PATROL_TARGET).
    scan_passes:
      - pass_id: 1
        level: 1
        direction: FORWARD
        arm_teach_pose: [null, null, null, null, null, null]
    first_taught_at:

  # ── 포장 출력 선반 (스택 관측 자리) ──────────────────────────────────
  #  ★ 이건 매거진 선반이 아니다. carrier_code_reader 가 "지금 어느 자리에
  #    서 있나" 를 이 목록의 구역으로 판정하고 그 자리의 arm_teach_pose 로
  #    팔을 세우기 때문에, 스택 관측 자세를 물리는 자리가 여기다. 이 항목이
  #    없으면 스택 앞에서도 매거진용 자세(shelf_1_top_close_centered)로
  #    폴백해서 QR 이 화면에 안 들어온다.
  #
  #  waypoint 는 task_manager.py DEFAULT_STACK_PICK_ROUTE 의 마지막 점이고,
  #  관절값은 isaacpjt/tools/out/taught_poses.yaml 의 packaging_output_scan
  #  을 그대로 옮긴 것이다(그 파일은 도, 이 파일은 라디안 — meta.units).
  #  둘 중 하나를 고치면 나머지도 같이 고쳐야 한다.
  #
  #  standoff_distance 0.35 는 구역 반경이다. 로봇이 이 안에 있으면 이
  #  자세를 쓴다. 매거진 정차점(x 약 -0.6)과 겹치지 않는다.
  #
  #  ☞ 웹 「설정 > 선반」 탭에 선반 하나로 더 뜬다. 스캔 작업을 배정하지 말 것.
  - shelf_id: PKG-OUT
    waypoint_start: {x: 3.46, y: 1.70, theta: 0.0}
    waypoint_end: {x: 3.46, y: 1.70, theta: 0.0}
    standoff_distance: 0.35
    scan_passes:
      - pass_id: 1
        level: 1
        direction: FORWARD
        arm_teach_pose: [-1.622864, 1.012564, 2.10307, 1.579492, 1.570789, 1.588239]
    first_taught_at: '2026-09-22'
