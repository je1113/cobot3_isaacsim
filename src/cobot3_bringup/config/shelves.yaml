# ══════════════════════════════════════════════════════════════════════
#  선반 정의 — 웹 관제 UI 「설정 > 선반」 탭이 읽고 쓴다.
#
#  왜 DB 가 아니라 파일인가: docs/DB구성.md §10-1.
#    "주인이 하나(엔지니어), 미션 시작 때 한 번 읽는다."
#  화면에서 편집한다는 사실 자체는 DB 사유가 아니다 — 편집기는 파일도 쓴다.
#
#  ★ 구조는 화면(ShelfSettingsPage)의 상태 모양을 그대로 따른다. 순서도 화면
#    순서라서 map 이 아니라 **리스트**다.
#
#  ★ 여기 숫자는 숫자로 적는다. 화면은 <input type="number"> 라 값을 문자열로
#    들고 있지만, 이 파일은 로봇도 읽는다 — task_manager 가 "-4.85" 를 좌표로
#    쓸 수는 없다. 문자열↔숫자 변환은 web/backend/app/shapes.py 한 곳에서 한다.
#    미입력은 null 이고, 화면에는 '' 로 나간다.
#
#  ★ 티칭 완료 판정: scan_passes 가 하나 이상 있고, 모든 층의 arm_teach_pose
#    6칸이 전부 채워져 있을 것. 하나라도 비면 작업 배정이 422 로 거절된다.
#    (판정 규칙의 원본은 shapes.shelf_is_taught — 화면과 같은 규칙이어야 한다)
# ══════════════════════════════════════════════════════════════════════
meta:
  units: m, rad
  joints: 6            # arm_teach_pose 는 항상 J1..J6 여섯 칸

shelves:
  - shelf_id: SHELF-A
    # ★ 이 키가 없으면 task_manager 가 이 선반을 이 로봇의 것으로 못 찾고
    #   DEFAULT_PATROL_ROUTE 폴백으로 떨어진다. 그 폴백은 모듈 상수 하나라
    #   로봇마다 달라지지 않아서, 두 대가 똑같은 좌표로 가 같은 통로에서
    #   마주 본다 — 실제로 그렇게 돌았다. 지금은 상대가 설정된 채로 폴백에
    #   떨어지면 task_manager 가 뜨지 않고 죽는다(_resolve_patrol_route).
    #   좌표 자체는 472c208 의 USD 실측값을 그대로 쓴다.
    assigned_robot: robot1
    # 선반을 훑기 시작하는 자리와 끝내는 자리 (map 프레임, theta 는 rad).
    # standoff_distance 는 선반 면에서 떨어져 서는 거리다.
    #
    # ★ 2026-09-22 재측정: 이전 값(x=-4.85, y=1.55)은 simple_factory_layout.usda
    #   의 실제 선반과 안 맞는 옛 레이아웃 좌표였다(x가 3m 넘게 벗어나 있었다).
    #   World/Magazines/shelf_1_magaines(라벨 y=2.586, x -2.44~-0.64) +
    #   World/Environment/PickupZone/Shelf_01(구조물, y 2.493~3.413) 를 실측해
    #   다시 잡았다 — 로봇은 선반 남쪽(코리도어)에서 북쪽을 보고 선다.
    #   task_manager._route_from_shelves() 가 이 두 점을 그대로 순찰 경로로
    #   쓴다 — patrol_waypoint 구간 전체가 아래 zone(standoff 포함) 안에
    #   들어가야 왕복 내내 QR 인식이 시도된다.
    # ★ 위 재측정의 매거진 위치(y=2.586)는 그대로 쓰되, 정차선과 x 범위는
    #   시뮬을 보며 잡은 값으로 되돌렸다(2026-09-22).
    #
    #   되돌린 이유는 START 단계다. task_manager 의 START 는 Nav2 로
    #   waypoint_start 까지 가고, Nav2 는 목표에서 최종 yaw 를 맞추려고
    #   제자리 회전을 한다. 재측정값의 시작점 (-2.6, 2.2) 는 선반 통로
    #   깊숙한 곳이라 여유가 0.25 m 뿐인데, 이 기체는 base_link 가 앞에
    #   치우쳐 뒤로 0.607 m 나간다(외접 0.656 m). 실측: 로봇이 그 자리에서
    #   45 초 동안 0.26 m 밖에 못 가고 yaw 만 351도 흔들며 갇혔다.
    #   시작점을 통로 동쪽(x=+0.60, 여유 0.95 m)에 두면 회전은 넓은 데서
    #   하고 선반 앞은 직진으로만 지나간다.
    #
    #   ☞ 대가: 끝점이 -1.20 이라 선반 서쪽(x < -1.20)은 안 훑는다.
    #     매거진이 x -2.44~-0.64 에 걸쳐 있다는 재측정이 맞으므로, 서쪽
    #     매거진까지 보려면 끝점을 늘리고 그만큼 시작점 여유를 다시 봐야 한다.
    # ★ 정차선은 "매거진 라벨에서 0.35 m" 다 (2026-09-22).
    #
    #   근거 — pick 로그에서 나온 prior(파지점) 와 실제 정차 위치로 관계를 뽑았다:
    #       prior 옆거리 ≈ (base→매거진 거리) + 0.179 m     ← QR 라벨 → 플랜지 중심
    #   관측 자세는 그 파지점보다 0.25 m 위이고(grasp.yaml observe_cam_height_m),
    #   팔 베이스는 base_link 기준 (-0.206, 0, 0.549), M0609 도달은 0.90 m 다.
    #   그래서 base→매거진 이 0.45 m 를 넘으면 관측 자세 IK 가 안 풀린다:
    #       0.60 m -> 팔에서 0.987 m  ★ 초과   (robot2 가 실제로 이렇게 죽었다)
    #       0.45 m -> 0.873 m  ✅
    #       0.35 m -> 0.804 m  ✅ 여유 0.096
    #   robot1 은 0.40 m 에서 SCAN 이 성공했으므로 0.35 는 그보다 5 cm 더 붙인 값이다.
    #   매거진 y=+2.586 → 정차선 2.586 - 0.35 = 2.236
    # ★★ 이 y 는 "차체 사각형을 점유맵에 실제로 놓아 본" 값이다(2026-09-22).
    #   점에서 장애물까지의 거리로 판정하면 안 된다 — 이 로봇은 원이 아니라
    #   앞 0.14 · 뒤 0.607 · 반폭 0.25(+패딩 0.03) 인 길쭉한 사각형이라,
    #   장애물이 옆에 있느냐 앞뒤에 있느냐로 결과가 완전히 달라진다.
    #   실제로 PKG-OUT 은 점 거리 0.20 인데 차체로 재면 안 닿고(장애물이 앞),
    #   순찰선은 점 거리가 더 넉넉해 보여도 옆구리가 선반을 파고들었다.
    #
    #   구간 전체(waypoint_start ↔ end)를 훑어 겹침이 0 이 되는 가장 가까운 선:
    #       0.30 m -> 겹침 384    0.35 -> 192    0.40 -> ✅
    #   그래서 매거진(y=+2.586)에서 0.40 m 인 2.186 이다. 0.35(2.236)는
    #   내가 틀린 도달거리 계산으로 당겼던 값이고, 차체가 선반에 박혔다.
    # ★ 사용자가 시뮬을 보며 정한 값이다(2026-09-22). 매거진(y=+2.586)에서
    #   0.40 m. 원래 SHELF_STANDOFF_M(0.55) 정차선이 2.0364 였고 거기서
    #   "테이블 쪽으로 10 cm" 붙인 것이다.
    #   ☞ 지도(simple_factory_layout.png)로 차체 여유를 재면 좁아 보이지만
    #     실제 씬에서는 안 닿는다 — 지도 값으로 이 좌표를 되돌리지 말 것.
    waypoint_start: {x: 0.60, y: 2.1864, theta: 0.0}
    waypoint_end: {x: -1.20, y: 2.1864, theta: 0.0}
    standoff_distance: 0.7
    # ★ 관절값은 isaacpjt/tools/out/taught_poses.yaml 의 shelf_1_top_close_centered
    #   (2026-09-17 캡처, joints_rad) 를 그대로 옮겼다 — 그 자세는 base_link
    #   y=1.45, 매거진과의 거리 0.55m 에서 QR 이 uv(649,382)로 화면 중앙 근처에
    #   잡히는 것까지 실측된 자세다(qr_in_view dist_m=0.2775). 위 waypoint 의
    #   standoff 0.7 은 같은 0.55m 오프셋 논리(99fe09f 커밋 근거)를 새 매거진
    #   위치(y=2.586)에 옮긴 것이라 relative 기하가 같다 — 그래도 이 자세는
    #   **옛 씬(x≈-6.5) 기준으로 티칭된 값을 포팅한 것**이라, 이 waypoint에서
    #   실측 확인 전까지는 잠정값이다.
    scan_passes:
      - pass_id: 1
        level: 1
        direction: FORWARD
    # ★ 2026-09-23: 사용자 지시로 다시 채웠다(abee24d 가 null 로 비웠던 것).
    #   값은 isaacpjt/tools/out/taught_poses.yaml 의 shelf_1_top_close_centered
    #   joints_rad 그대로다 — 472c208 이 넣었던 값과 같다. 웹은 티칭 층을
    #   1층 하나로 고정했으므로(ShelfSettingsPage) 이 한 칸이 선반의 자세다.
    #
    #   ☞ 값이 있으면 carrier_code_reader._observe() 가 joints_deg 경로로
    #     간다. 진행 방향별 폴백(0 → s1_bottom_scan)은 더 안 쓰이고, 왕복
    #     내내 이 자세 하나다. 웹의 티칭 완료 판정도 이 칸으로 켜진다
    #     (shapes.shelf_is_taught — 작업 배정이 422 로 막히지 않는다).
    #   ☞ 옛 씬(x≈-6.5)에서 티칭한 것을 포팅한 값이라 실측 재티칭 전까지는
    #     잠정값이다. 웹 「현재 자세로 저장」 이 이 칸을 덮어쓴다.
        arm_teach_pose: [0.235391, 0.670242, 2.617961, 1.579533, 1.570796, 1.500994]
    # 위 포팅 시점에 찍었다 — 이 waypoint 에서 실측 재확인 후에도 그대로 둔다
    # (첫 완성 시점 기록 규칙, 이 파일 머리주석 참고).
    first_taught_at: '2026-09-22'
  - shelf_id: SHELF-B
    # ★ 이 키가 없으면 task_manager 가 이 선반을 이 로봇의 것으로 못 찾고
    #   DEFAULT_PATROL_ROUTE 폴백으로 떨어진다. 그 폴백은 모듈 상수 하나라
    #   로봇마다 달라지지 않아서, 두 대가 똑같은 좌표로 가 같은 통로에서
    #   마주 본다 — 실제로 그렇게 돌았다. 지금은 상대가 설정된 채로 폴백에
    #   떨어지면 task_manager 가 뜨지 않고 죽는다(_resolve_patrol_route).
    #   좌표 자체는 472c208 의 USD 실측값을 그대로 쓴다.
    assigned_robot: robot2
    # ★ 2026-09-23 재측정: 시험 씬에서 magazine_2_blue 가 Shelf_02 의 반대쪽
    #   면으로 옮겨졌다(simple_factory_layout_test.usda, ae4f06b).
    #       local y   -2.200  ->  -2.918677
    #       월드 y    -1.614  ->  -2.332318
    #   이 한 번으로 SHELF-B 가 **SHELF-A 를 y 로 평행이동한 판**이 됐다.
    #   선반 면 기준 매거진 오프셋이 뒤집혀 SHELF-A 와 같아졌기 때문이다:
    #       magazine_1 - Shelf_01 = -0.367            (선반 남쪽 면)
    #       magazine_2 - Shelf_02 = +0.359 -> -0.359  (같은 남쪽 면으로 이동)
    #   그래서 아래 좌표는 전부 SHELF-A 값에 Δy 를 더한 것이다:
    #       Δy = magazine_2.y - magazine_1.y = -2.332318 - 2.586359 = -4.918677
    #
    # ★ 거울이 아니라 평행이동이다 — 이번에 바뀐 것의 전부가 이것이다.
    #   예전에는 매거진이 선반 북쪽 면에 있어서 로봇이 북쪽 통로에서 남쪽을
    #   보고 섰다(theta = pi). 좌우가 뒤집힌 거울 배치였다. 지금은 매거진이
    #   남쪽 면이라 로봇도 SHELF-A 와 똑같이 **남쪽에서 북쪽을** 본다.
    #   theta 는 0.0 이고, 선반은 여전히 로봇 왼쪽(+y)에 온다.
    #
    #   ☞ 거울로 읽으면(매거진 북쪽 0.40 m = y -1.932) 기하가 성립하지 않는다.
    #     Shelf_02 선반판이 y[-2.473, -1.473] 를 차지해서 그 자리는 선반
    #     안쪽이다. 통로는 이제 남쪽(-y)뿐이다 — 되돌리지 말 것.
    #
    # ★ 매거진 USD 의 orient 는 여전히 180도(6.123234e-17, 0, 0, 1)지만 이
    #   배치에서 무해하다. 에셋이 QR 라벨을 -Y·+Y 양쪽 벽에 같은 코드로 하나씩
    #   들고 있고(magazine_2_blue_qr.usda 의 qr_label_ny · qr_label_py — 두 면이
    #   z 축 180도 회전 대칭), grasp.yaml 의 T_QR_grasp_xyz 는 어느 라벨을 봐도
    #   같은 플랜지 중심을 가리킨다. 파지 자세의 그리퍼 yaw 도 차체 yaw 를
    #   90도 단위로 스냅해 따라 돈다(sim_backend._target_quat) — 자동으로 맞는다.
    #
    # ★ y = -2.7323 — 매거진(y=-2.332318)에서 0.40 m. SHELF-A 의 2.1864 에
    #   Δy 를 더한 값이고, 정차 거리도 robot1 과 같은 0.40 이다. 두 판의 기하가
    #   이제 완전히 같으므로 SHELF-A 에서 확인된 것이 그대로 성립한다 —
    #   그쪽 "차체 사각형을 점유맵에 놓아 본" 검사(0.40 -> 겹침 0)와
    #   관측 IK 여유(0.40 일 때 0.077, 0.45 일 때 0.027) 주석을 같이 읽어라.
    #
    #   ☞ 옛 배치의 0.45(y=-1.164)는 그쪽 통로가 좁아 한 칸 물렸던 값이다.
    #     지금은 SHELF-A 와 같은 통로라 같은 0.40 을 쓴다. OBSERVE 가 IK 로
    #     죽어서 이 값을 움직여야 하면 SHELF-A 와 **같이** 움직여라 —
    #     한쪽만 바꾸면 이 항목의 전제(평행이동)가 깨진다.
    #
    #   ☞ 평행이동이 7.3 mm 어긋난다 — 매거진과 선반 구조물의 Δy 가 다르다:
    #       Shelf_02 - Shelf_01     = -4.925962
    #       magazine_2 - magazine_1 = -4.918677
    #     즉 magazine_2 가 선반 남쪽 기둥에 7.3 mm 더 붙어 있다. 정차선을
    #     매거진 기준(0.40)으로 잡았으므로 팔 도달 기하는 robot1 과 정확히
    #     같고, 대신 차체와 기둥 사이가 그만큼 좁다(패딩 0.03 포함 사각형으로
    #     재면 robot1 2.3 mm, robot2 9.6 mm 물린다 — 패딩을 빼면 둘 다 안
    #     닿는다: 여유 27.7 mm / 20.4 mm). 점유맵 해상도(0.05)보다 작은 차이라
    #     로 판정은 둘이 같다. 기둥에 긁히면 선반 기준(y=-2.7396)으로 7 mm
    #     빼는 게 먼저다 — 매거진 거리는 0.4073 이 되고 IK 여유는 그만큼 준다.
    #
    # ★ x 범위도 SHELF-A 그대로다(시작 0.60 → 끝 -1.20). 두 선반의 기둥이
    #   x[-2.78, -0.30] 로 같은 자리라 x 는 평행이동에서 안 바뀐다.
    #   시작점을 통로 동쪽(x=+0.60)에 두는 이유도 SHELF-A 와 같다 — START 의
    #   제자리 회전을 넓은 데서 한다. 이 자리 여유는 1.01 m 로, 옛 배치의
    #   시작점(-0.541, 여유 0.45 m)보다 낫다.
    #
    #   ☞ 대가는 SHELF-A 와 똑같다: 끝점이 -1.20 이라 선반 서쪽(x < -1.20)은
    #     안 훑는다.
    waypoint_start: {x: 0.60, y: -2.7323, theta: 0.0}
    waypoint_end: {x: -1.20, y: -2.7323, theta: 0.0}
    standoff_distance: 0.7
    # ★ SHELF-A 와 같은 관절값(파지·관측 자세)을 그대로 쓴다 — 숫자는 안 바뀌고
    #   근거가 바뀌었다.
    #
    #   예전에는 theta = pi 로 세운 거울 배치였고, "선반이 항상 로봇 왼쪽에
    #   오도록 180도 돌려 세우니 base 프레임 관절값이 그대로 맞는다" 는 좌우
    #   대칭 논증으로 재사용했다(99fe09f/fa84db8). 2026-09-23 매거진 이동
    #   뒤로는 그냥 **같은 배치를 y 로 옮긴 것**이라 그 논증이 필요 없다:
    #   theta 0.0, 선반은 여전히 로봇 왼쪽(+y), 매거진까지 0.40 m —
    #   base_link 기준 상대 기하가 SHELF-A 와 한 치도 다르지 않다.
    #
    #   ☞ 그래서 이제 이 자세는 SHELF-A 와 한 몸이다. 한쪽을 재티칭하면
    #     다른 쪽도 같은 값으로 따라가야 한다.
    #   SHELF-A 와 마찬가지로 포팅된 잠정값 — 실측 확인 필요.
    scan_passes:
      - pass_id: 1
        level: 1
        direction: FORWARD
    # ★ 2026-09-23: 사용자 지시로 다시 채웠다(abee24d 가 null 로 비웠던 것).
    #   값은 isaacpjt/tools/out/taught_poses.yaml 의 shelf_1_top_close_centered
    #   joints_rad 그대로다 — 472c208 이 넣었던 값과 같다. 웹은 티칭 층을
    #   1층 하나로 고정했으므로(ShelfSettingsPage) 이 한 칸이 선반의 자세다.
    #
    #   ☞ 값이 있으면 carrier_code_reader._observe() 가 joints_deg 경로로
    #     간다. 진행 방향별 폴백(0 → s1_bottom_scan)은 더 안 쓰이고, 왕복
    #     내내 이 자세 하나다. 웹의 티칭 완료 판정도 이 칸으로 켜진다
    #     (shapes.shelf_is_taught — 작업 배정이 422 로 막히지 않는다).
    #   ☞ 옛 씬(x≈-6.5)에서 티칭한 것을 포팅한 값이라 실측 재티칭 전까지는
    #     잠정값이다. 웹 「현재 자세로 저장」 이 이 칸을 덮어쓴다.
        arm_teach_pose: [0.235391, 0.670242, 2.617961, 1.579533, 1.570796, 1.500994]
    first_taught_at: '2026-09-22'

  # ── 포장 출력 선반 (스택 관측 자리) ──────────────────────────────────
  #  ★ 이건 매거진 선반이 아니다. carrier_code_reader 가 "지금 어느 자리에
  #    서 있나" 를 이 목록의 구역으로 판정하고 그 자리의 arm_teach_pose 로
  #    팔을 세우기 때문에, 스택 관측 자세를 물리는 자리가 여기다. 이 항목이
  #    없으면 스택 앞에서도 매거진용 자세(shelf_1_top_close_centered)로
  #    폴백해서 QR 이 화면에 안 들어온다.
  #
  #  waypoint 는 task_manager.py DEFAULT_STACK_PICK_ROUTE 의 마지막 점이고,
  #  관절값은 isaacpjt/tools/out/taught_poses.yaml 의 packaging_output_scan
  #  을 그대로 옮긴 것이다(그 파일은 도, 이 파일은 라디안 — meta.units).
  #  둘 중 하나를 고치면 나머지도 같이 고쳐야 한다.
  #
  #  standoff_distance 0.35 는 구역 반경이다. 로봇이 이 안에 있으면 이
  #  자세를 쓴다. 매거진 정차점(x 약 -0.6)과 겹치지 않는다.
  #
  #  ☞ 웹 「설정 > 선반」 탭에 선반 하나로 더 뜬다. 스캔 작업을 배정하지 말 것.
  - shelf_id: PKG-OUT
    # ★ theta = -pi/2 (-90°). 스택을 집으러 갈 때 이 방향으로 서야 한다
    #   (2026-09-22, 시뮬을 보고 정함). 순찰(SHELF-A theta 0°)과 90° 차이이고
    #   로더 주차 자세(TEST_LOADER theta 0°)와도 90° 다르다 — 0° 로 두면
    #   로더에 설 때와 같은 방향이 되어 스택을 등지고 선다.
    #
    #   ☞ taught_poses.yaml 의 packaging_output_scan 은 베이스 yaw +2.4° 에서
    #     티칭된 값이라 이 방향과 다르다. 그 자세의 J1 이 -93° 로 팔을 옆으로
    #     돌려 놓는데, 베이스를 -90° 돌리면 그만큼 또 돌아간다 — 스캔이 안
    #     맞으면 관측 자세를 이 방향에서 다시 티칭해야 한다.
    #
    #   STACK_NAV 가 이 좌표와 방향으로 Nav2 goal 을 낸다
    #   (task_manager._resolve_stack_pose -> _to_pose).
    waypoint_start: {x: 3.46, y: 1.70, theta: -1.570796}
    waypoint_end: {x: 3.46, y: 1.70, theta: -1.570796}
    standoff_distance: 0.35
    scan_passes:
      - pass_id: 1
        level: 1
        direction: FORWARD
        # ★ 2026-09-23: 사용자 지시로 다시 채웠다(abee24d 가 null 로 비웠던 것).
        #   taught_poses.yaml 의 packaging_output_scan joints_rad 그대로다.
        #   carrier_code_reader 의 FALLBACK_POSE_BY_SHELF 가 이름으로 부르던
        #   것과 같은 자세라 팔 동작은 바뀌지 않는다 — 경로만 joints_deg 로 간다.
        arm_teach_pose: [-1.622864, 1.012564, 2.10307, 1.579492, 1.570789, 1.588239]
    first_taught_at: '2026-09-22'
