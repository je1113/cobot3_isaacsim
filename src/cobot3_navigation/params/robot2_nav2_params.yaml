docking_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0

    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3

    base_frame: "base_link"
    fixed_frame: "odom"

    dock_prestaging_tolerance: 0.5

    dock_plugins: ["simple_charging_dock"]

    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"

      docking_threshold: 0.05
      staging_x_offset: -0.7

      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false

      dock_direction: "forward"

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0

      filter_coef: 0.1

      controller:
        k_phi: 3.0
        k_delta: 2.0
        v_linear_min: 0.15
        v_linear_max: 0.15
        use_collision_detection: true

        costmap_topic: "local_costmap/costmap_raw"
        footprint_topic: "local_costmap/published_footprint"

        transform_tolerance: 0.1
        projection_time: 5.0
        simulation_step: 0.1
        dock_collision_threshold: 0.3


collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_link"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"

    state_topic: "collision_monitor_state"

    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    enable_stamped_cmd_vel: false

    polygons: ["FootprintApproach"]

    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: true
      enabled: true

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "/robot2/scan"
      source_timeout: 0.5
      enabled: true


amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"

    scan_topic: "/robot2/scan"
    map_topic: "map"

    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"

    max_beams: 360
    max_particles: 2000
    min_particles: 500

    pf_err: 0.05
    pf_z: 0.99

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    resample_interval: 3

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    save_pose_rate: 0.5
    sigma_hit: 0.2

    tf_broadcast: true
    transform_tolerance: 1.0

    # ★ robot1 과 같은 값이어야 한다. 이 둘은 "필터를 갱신(=amcl_pose 를 발행)
    #   하기 전에 로봇이 얼마나 움직여야 하는가" 다. robot2 만 AMCL 기본값
    #   (0.25 m / 0.2 rad)으로 남아 있어서 위치를 25 cm 마다 한 번씩만 알았다.
    #
    #   그러면 순찰 주행이 깨진다 — nav_server 의 도착 판정 반경
    #   POSITION_TOLERANCE 가 0.12 m 인데 위치 갱신 간격이 그보다 넓으면
    #   정차점을 그냥 지나친다. 방향은 goal 시작 때 고정되므로 그대로 밀고
    #   가다가 DRIVE_TIMEOUT_S 까지 엉뚱한 곳으로 간다.
    #
    #   즉 update_min_d < POSITION_TOLERANCE 여야 한다.
    update_min_a: 0.03
    update_min_d: 0.05

    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false

    # ==========================================================
    # ROBOT 2 START POSITION
    # Isaac Sim:
    # X = 3.490373703049795
    # Y = -5.227116321664516
    # Rotate Z = 0 deg
    # ==========================================================
    initial_pose:
      x: 5.5
      y: -7.57474
      z: 0.0
      yaw: 3.14159

amcl_map_client:
  ros__parameters:
    use_sim_time: true


amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true


bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: "map"
    robot_base_frame: "base_link"

    odom_topic: "chassis/odom"

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    navigators:
      - navigate_to_pose
      - navigate_through_poses

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code


controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0
    costmap_update_timeout: 0.30

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - general_goal_checker

    controller_plugins:
      - FollowPath

    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"

      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"

      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: true

      # ★ robot1 과 같은 값이어야 한다. 두 대는 같은 기체이고 같은 통로를
      #   다닌다. 여기만 Nav2 기본값에 가까운 거친 값으로 남아 있어서
      #   robot2 가 robot1 보다 3~4 배 빠르고 6 배 급하게 가속했다.
      #
      # ★ min_vel_x 가 특히 중요하다. 0.0 이면 DWB 가 **후진 궤적을 아예
      #   만들지 않는다.** 선반 앞처럼 좁은 데서 후진이 막히면 빠져나오는
      #   길이 제자리 회전뿐인데, 이 기체는 base_link 가 앞에 치우쳐 있어
      #   뒤로 0.607 m 나간다(외접 0.656 m). 선반 앞 여유는 0.40 m 뿐이다 —
      #   12_place_test2.py 에 "robot2 가 SHELF-B 앞에서 넘어졌다" 로 기록된
      #   사고가 정확히 그 상황이다. 후진을 열어 둬야 회전하지 않고 나온다.
      min_vel_x: -0.25
      min_vel_y: 0.0

      max_vel_x: 0.25
      max_vel_y: 0.0
      max_vel_theta: 0.3

      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0

      acc_lim_x: 0.4
      acc_lim_y: 0.0
      acc_lim_theta: 0.8

      decel_lim_x: -0.4
      decel_lim_y: 0.0
      decel_lim_theta: -0.8

      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20

      sim_time: 1.7

      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.2

      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      BaseObstacle.scale: 0.02

      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1

      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1

      PathDist.scale: 32.0
      GoalDist.scale: 24.0

      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: "odom"
      robot_base_frame: "base_link"

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true

      width: 6
      height: 6
      resolution: 0.05

      transform_tolerance: 0.3

      footprint: "[ [0.14, 0.25], [0.14, -0.25], [-0.607, -0.25], [-0.607, 0.25] ]"
      footprint_padding: 0.03

      always_send_full_costmap: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true
        enabled: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: "/robot2/scan"

          data_type: "LaserScan"

          clearing: true
          marking: true

          max_obstacle_height: 2.0

          obstacle_max_range: 3.0
          obstacle_min_range: 0.05

          raytrace_max_range: 10.0
          raytrace_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        enabled: true

        cost_scaling_factor: 3.0
        inflation_radius: 0.8


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: "map"
      robot_base_frame: "base_link"

      update_frequency: 1.0
      publish_frequency: 1.0

      resolution: 0.05

      transform_tolerance: 0.3

      footprint: "[ [0.14, 0.25], [0.14, -0.25], [-0.607, -0.25], [-0.607, 0.25] ]"
      footprint_padding: 0.25

      always_send_full_costmap: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true
        enabled: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: "/robot2/scan"

          data_type: "LaserScan"

          clearing: true
          marking: true

          max_obstacle_height: 2.0

          raytrace_max_range: 10.0
          raytrace_min_range: 0.0

          obstacle_max_range: 10.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 0.3
        inflation_radius: 1.0

  global_costmap_client:
    ros__parameters:
      use_sim_time: true

  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true


map_server:
  ros__parameters:
    use_sim_time: true

    yaml_filename: ""


map_saver:
  ros__parameters:
    use_sim_time: true

    save_map_timeout: 5000

    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

    map_subscribe_transient_local: true


planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 10.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"

      tolerance: 0.5
      use_astar: false
      allow_unknown: true


planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true


smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins:
      - simple_smoother

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: true

    costmap_topic: "local_costmap/costmap_raw"
    footprint_topic: "local_costmap/published_footprint"

    cycle_frequency: 5.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

    global_frame: "odom"
    robot_base_frame: "base_link"

    transform_tolerance: 0.2

    simulate_ahead_time: 2.0

    max_rotational_vel: 1.2
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2


waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"

      enabled: true
      waypoint_pause_duration: 200


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0

    scale_velocities: false
    feedback: "OPEN_LOOP"

    # ★ 위 FollowPath 와 같은 이유로 robot1 과 맞춘다. 스무더 한계가
    #   컨트롤러 한계보다 높으면 컨트롤러를 조여도 의미가 없다.
    max_velocity:
      - 0.25
      - 0.0
      - 0.3

    min_velocity:
      - -0.25
      - 0.0
      - -0.3

    max_accel:
      - 0.4
      - 0.0
      - 0.8

    max_decel:
      - -0.4
      - 0.0
      - -0.8

    velocity_timeout: 1.0

    odom_topic: "chassis/odom"

    odom_duration: 0.1
